<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Claude Session Reminder</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <h1>Claude Limit Reminder</h1>

    <div class="status-section">
      <div class="status-row">
        <span class="status-label">Status:</span>
        <span id="status-text" class="status-value">Checking...</span>
      </div>
      <div id="countdown" class="countdown"></div>
      <div id="reset-time-display" class="reset-time"></div>
    </div>

    <div class="detect-section">
      <p class="detect-hint">Open <a href="https://claude.ai/settings/usage" target="_blank">Claude Usage</a> page, then click:</p>
      <button id="detect-btn" class="btn primary">Detect Reset Time from Page</button>
    </div>

    <div class="settings-section">
      <h2>Settings</h2>
      <div class="input-group">
        <label for="reminder-minutes">Remind me (minutes before reset):</label>
        <input type="number" id="reminder-minutes" value="30" min="1" max="180">
      </div>
      <button id="save-btn" class="btn secondary">Save Settings</button>
    </div>

    <div id="message" class="message"></div>

    <div class="info-section">
      <h3>How to use</h3>
      <ul>
        <li>Go to claude.ai/settings/usage</li>
        <li>Click "Detect Reset Time from Page"</li>
        <li>You'll be notified before limit resets</li>
      </ul>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
